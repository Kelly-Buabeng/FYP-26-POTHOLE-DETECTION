services:
  - type: web
    name: fyp-26-pothole-detection
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: APP_ENV
        value: production
      # Secrets and deployment-specific values — set these in the Render
      # dashboard (Environment tab), not in this file.
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MODEL_PATH
        value: ml/weights/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
